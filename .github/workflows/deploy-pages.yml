name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the static export
        run: pnpm --filter web build
        env:
          # GitHub Pages project site: /<repo> prefix for routing *and* for the
          # runtime atlas fetch (apps/web/lib/site.ts).
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_ORIGIN: https://${{ github.repository_owner }}.github.io
      - name: Verify the export
        run: |
          test -f apps/web/out/index.html
          # Without .nojekyll, Pages drops the whole _next/ directory and the page
          # loads as a white screen.
          test -f apps/web/out/.nojekyll
          test -f apps/web/out/assets/atlas-game.png
          grep -q "LET ME LOVE YOU" apps/web/out/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
